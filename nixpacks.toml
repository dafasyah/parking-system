[phases.setup]
nixPkgs = ['php82', 'php82Extensions.gd', 'php82Extensions.zip', 'php82Extensions.pdo', 'php82Extensions.pdo_mysql', 'php82Extensions.mbstring', 'php82Extensions.intl', 'php82Extensions.imagick', 'imagemagick', 'php82Packages.composer', 'nodejs']

[phases.install]
cmds = [
  'composer install --optimize-autoloader --no-dev'
]

[phases.build]
cmds = [
  'npm ci --include=dev',
  'npm run build',
  'chmod -R 775 storage bootstrap/cache'
]

[start]
cmd = 'echo "DEBUG: DATABASE_URL=$DATABASE_URL" && echo "DEBUG: DB_CONNECTION=$DB_CONNECTION" && rm -rf bootstrap/cache/*.php && php artisan config:clear && php artisan cache:clear && php artisan storage:link || true && sleep 3 && php artisan migrate --force && php artisan db:seed --force || true && php artisan serve --host=0.0.0.0 --port=$PORT'
