[phases.setup]
nixPkgs = ['php82', 'php82Extensions.gd', 'php82Extensions.zip', 'php82Extensions.pdo', 'php82Extensions.pdo_pgsql', 'php82Extensions.mbstring', 'php82Extensions.intl', 'php82Packages.composer', 'nodejs']

[phases.install]
cmds = [
  'composer install --optimize-autoloader --no-dev --ignore-platform-reqs'
]

[phases.build]
cmds = [
  'npm ci --include=dev',
  'npm run build',
  'chmod -R 775 storage bootstrap/cache',
  'php artisan storage:link || true'
]

[start]
cmd = 'php artisan config:clear && php artisan cache:clear && sleep 2 && php artisan migrate --force && php artisan db:seed --force --class=DatabaseSeeder || true && php artisan serve --host=0.0.0.0 --port=$PORT'
